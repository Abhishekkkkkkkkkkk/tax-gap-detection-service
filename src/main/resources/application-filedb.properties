# ==============================================================================
# File-Based Real Persistent SQL Database Profile
# (Stored on physical disk at ./data/tgd_real_db, NOT in-memory)
# Activate via: --spring.profiles.active=filedb
# ==============================================================================

spring.datasource.url=jdbc:h2:file:./data/tgd_real_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Optional web console for inspecting data at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
